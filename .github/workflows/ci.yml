name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint API
        run: pnpm --filter api lint

      - name: Test API
        run: pnpm --filter api test

      - name: Build API
        run: pnpm --filter api build

      - name: Lint Web
        run: pnpm --filter web lint

      - name: Test Web
        run: pnpm --filter web test

      - name: Build Web
        run: pnpm --filter web build
        env:
          API_URL: http://localhost:3000

  api-e2e:
    name: API E2E (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: manual_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d manual_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-only-secret-not-for-production-2026
      TEST_DATABASE_URL: postgresql://app:app@localhost:5432/manual_ci_test?schema=public
      TEST_REDIS_URL: redis://localhost:6379/14

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Run API E2E tests
        run: pnpm --filter api test:e2e

  docker-api:
    name: Docker API (build y verificación)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API Docker image
        run: |
          docker build \
            --progress=plain \
            -f apps/api/Dockerfile \
            -t pispiar-api:ci .

      - name: Verify non-root user
        run: |
          USER_NAME=$(docker image inspect pispiar-api:ci --format '{{.Config.User}}')
          test "$USER_NAME" = "node"

      - name: Verify compiled API and runtime dependencies
        run: |
          docker run --rm --entrypoint node pispiar-api:ci -e '
            const fs = require("node:fs");
            for (const file of [
              "dist/main.js",
              "dist/generated/prisma/client.js"
            ]) {
              if (!fs.existsSync(file)) {
                throw new Error("Falta archivo: " + file);
              }
            }
            require("bcrypt");
            require("@prisma/adapter-pg");
            console.log("API Docker: verificaciones correctas");
          '
